<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar - RoadCrew</title>
<link rel="icon" href="../img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/staff.css">
</head>
<body class="staff">
<div class="phone">

  <!-- ============ HEADER ============ -->
  <header class="sheader">
    <img class="sheader-avatar" id="s-avatar" src="../img/avatar-02.svg" alt="">
    <div class="sheader-body">
      <div class="sheader-name" id="s-name">&nbsp;</div>
      <div class="sheader-sub" id="s-sub">&nbsp;</div>
    </div>
    <button class="sheader-logout" type="button" data-logout>Log out</button>
  </header>

  <main class="scontent">

    <!-- Today card (rendered only when a duty covers today) -->
    <div id="today-slot"></div>

    <!-- ============ MONTH ============ -->
    <div class="month-card">
      <div class="month-bar">
        <button class="month-arrow" type="button" id="m-prev">&#9664;</button>
        <div class="month-name" id="m-label"></div>
        <button class="month-arrow" type="button" id="m-next">&#9654;</button>
      </div>
      <div id="m-grid"></div>
    </div>

    <!-- ============ UPCOMING ============ -->
    <div>
      <div class="up-title">Upcoming</div>
      <div class="up-list" id="up-list"></div>
      <div class="up-empty" id="up-empty" hidden></div>
    </div>

  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="sbotnav">
    <a class="sbotnav-item is-active" href="calendar.html">
      <div class="sbotnav-glyph"></div>
      <div class="sbotnav-label">Calendar</div>
    </a>
    <a class="sbotnav-item" href="uploads.html">
      <div class="sbotnav-glyph sbotnav-glyph-alt"></div>
      <div class="sbotnav-label">Uploads</div>
    </a>
    <button class="sbotnav-item" type="button" id="nav-profile">
      <div class="sbotnav-glyph sbotnav-glyph-round"></div>
      <div class="sbotnav-label">Profile</div>
    </button>
  </nav>

</div>

<!-- ============ PROFILE SHEET ============ -->
<div class="modal" id="profile">
  <div class="modal-box">
    <div class="modal-title" id="p-name">Profile</div>
    <div class="modal-text" id="p-email"></div>
    <div class="modal-text" id="p-region"></div>
    <div class="modal-foot">
      <button class="btn" type="button" id="p-close">Close</button>
      <button class="btn btn-danger" type="button" data-logout>Log out</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/util.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/calendar.js"></script>
<script src="../js/staff/calendar.js"></script>
</body>
</html>
